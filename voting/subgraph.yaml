specVersion: 1.0.0
indexerHints:
    prune: auto
schema:
    file: ./schema.graphql
dataSources:
    - kind: ethereum
      name: Voter
      network: berachain-mainnet
      source:
          abi: Voter
          address: "0x8160C59218be97F301a857cD8E72e5d3446621df"
          startBlock: 835802
      mapping:
          kind: ethereum/events
          apiVersion: 0.0.7
          language: wasm/assemblyscript
          entities:
              - Voter
              - Gauge
              - Pair
              - Token
          abis:
              - name: Voter
                file: ./abis/Voter.json
              - name: Pair
                file: ./abis/Pair.json
              - name: ERC20
                file: ./abis/ERC20.json
          eventHandlers:
              - event: GaugeCreated(indexed address,indexed address,indexed
                    address,address,address,address,address,address)
                handler: handleGaugeCreated
              - event: GaugeKilled(indexed address)
                handler: handleGaugeKilled
              - event: GaugeRevived(indexed address)
                handler: handleGaugeRevived
              - event: Voted(indexed address,indexed address,indexed
                    uint256,uint256,uint256,uint256)
                handler: handleVoted
              - event: Abstained(indexed address,indexed address,indexed
                    uint256,uint256,uint256,uint256)
                handler: handleAbstained
          file: ./mappings/voter.ts
templates:
    - kind: ethereum
      name: Gauge
      network: berachain-mainnet
      source:
          abi: Gauge
      mapping:
          kind: ethereum/events
          apiVersion: 0.0.7
          language: wasm/assemblyscript
          file: ./mappings/core.ts
          entities:
              - Gauge
              - GaugePosition
          abis:
              - name: Gauge
                file: ./abis/Gauge.json
          eventHandlers:
              - event: Deposit(indexed address,indexed address,uint256)
                handler: handleDeposit
              - event: Withdraw(indexed address,uint256)
                handler: handleWithdraw
